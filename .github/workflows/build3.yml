name: Build Test
on:
  push:
    branches: [develop, main]
jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_ext: zip
            arch: x64
            launcher_target: onedir
            agent_target: nsis
            node_version: '22'
            python_version: '3.12'
          - os: macos-latest
            artifact_ext: tar.gz
            arch: arm64
            launcher_target: onedir
            agent_target: dmg+zip
            node_version: '22'
            python_version: '3.12'
          - os: ubuntu-latest
            artifact_ext: tar.gz
            arch: x64
            launcher_target: onedir
            agent_target: appimage+deb
            node_version: '22'
            python_version: '3.12'
    env:
      PYTHON_VERSION: ${{ matrix.python_version }}
      NODE_VERSION: ${{ matrix.node_version }}
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - run: echo "matrix ok"

  release:
    name: Aggregate Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - run: echo "release ok"
