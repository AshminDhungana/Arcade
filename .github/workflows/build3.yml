name: Build Test
on:
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g., 1.0.0)'
        required: false
        type: string

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_ext: zip
            arch: x64
            launcher_target: onedir
            agent_target: nsis
            node_version: '22'
            python_version: '3.12'
          - os: macos-latest
            artifact_ext: tar.gz
            arch: arm64
            launcher_target: onedir
            agent_target: dmg+zip
            node_version: '22'
            python_version: '3.12'
          - os: ubuntu-latest
            artifact_ext: tar.gz
            arch: x64
            launcher_target: onedir
            agent_target: appimage+deb
            node_version: '22'
            python_version: '3.12'

    env:
      PYTHON_VERSION: ${{ matrix.python_version }}
      NODE_VERSION: ${{ matrix.node_version }}
      VERSION: ${{ github.event.inputs.version || github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            agent/package-lock.json

      - name: Install 7zip (Windows)
        if: runner.os == 'Windows'
        run: choco install 7zip -y

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Verify frontend/dist exists
        run: test -f frontend/dist/index.html

      - name: Install Python dependencies (Launcher)
        working-directory: backend
        run: |
          pip install -r requirements.txt -r requirements-dev.txt pyinstaller

      - name: Build Launcher with PyInstaller
        run: |
          pyinstaller arcade.spec --clean --noconfirm

      - name: Package Launcher artifact (Windows)
        if: runner.os == 'Windows'
        id: launcher_artifact_windows
        run: echo packaging-windows

      - name: Package Launcher artifact (macOS)
        if: runner.os == 'macOS'
        id: launcher_artifact_macos
        run: echo packaging-macos

      - name: Package Launcher artifact (Linux)
        if: runner.os == 'Linux'
        id: launcher_artifact_linux
        run: echo packaging-linux

  release:
    name: Aggregate Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - run: echo "release ok"
