name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libcups2-dev
      - name: Install dependencies
        run: pip install -r backend/requirements.txt ruff==0.8.0
      - name: Run ruff
        run: ruff check backend/ --target-version py312
      - name: Run ruff format check
        run: ruff format --check backend/

  type-check-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libcups2-dev
      - name: Install dependencies
        run: pip install -r backend/requirements.txt mypy==1.13.0
      - name: Run mypy
        run: mypy --strict backend/

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libcups2-dev
      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt pytest-cov
      - name: Run tests with coverage
        run: pytest backend/ --cov=backend --cov-report=xml --cov-fail-under=80
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Run lint
        run: cd frontend && npm run lint

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Run tests
        run: cd frontend && npm run test -- --run

  lint-agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "agent/package-lock.json"
      - name: Install dependencies
        run: cd agent && npm ci
      - name: Run lint
        run: cd agent && npm run lint

  check-sensitive-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check for private keys and PEM files in git history
        run: |
          echo "Checking for .pem files in git history..."
          if git log --all --full-history --name-only --pretty=format: -- "*.pem" | grep -q "\.pem$"; then
            echo "ERROR: .pem files found in git history"
            git log --all --full-history --name-only --pretty=format: -- "*.pem" | grep "\.pem$" | sort -u
            exit 1
          fi
          echo "Checking for private_key* files in git history..."
          if git log --all --full-history --name-only --pretty=format: -- "private_key*" | grep -q "private_key"; then
            echo "ERROR: private_key* files found in git history"
            git log --all --full-history --name-only --pretty=format: -- "private_key*" | grep "private_key" | sort -u
            exit 1
          fi
          echo "Checking for *.key files in git history..."
          if git log --all --full-history --name-only --pretty=format: -- "*.key" | grep -q "\.key$"; then
            echo "ERROR: *.key files found in git history"
            git log --all --full-history --name-only --pretty=format: -- "*.key" | grep "\.key$" | sort -u
            exit 1
          fi
          echo "All sensitive file checks passed."

  check-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check for private keys in repository
        run: |
          if git ls-files | grep -E '\.pem$|private_key' | grep -v '.gitignore'; then
            echo "ERROR: Private key files detected in repository"
            exit 1
          fi
      - name: Check for secrets in staged files (PR only)
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} | grep -E '\.pem$|private_key'; then
            echo "ERROR: Private key files in PR changes"
            exit 1
          fi
