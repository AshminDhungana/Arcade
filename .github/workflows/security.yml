name: Security

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'  # Daily at 02:00 UTC

jobs:
  security-scan-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libcups2-dev
      - name: Install security tools
        run: pip install -r backend/requirements.txt bandit==1.9.4 pip-audit==2.7.3
      - name: Run bandit
        run: bandit -r backend/ -f json -o bandit-report.json || true
      - name: Run pip-audit
        run: pip-audit -r backend/requirements.txt -f json -o pip-audit-report.json || true
      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit-report.json
          retention-days: 30

  dep-audit-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Audit frontend dependencies
        run: cd frontend && npm ci && npm audit --audit-level=high --json > npm-audit-frontend.json || true
      - name: Audit agent dependencies
        run: cd agent && npm ci && npm audit --audit-level=high --json > npm-audit-agent.json || true
      - name: Upload npm audit reports
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-reports
          path: |
            npm-audit-frontend.json
            npm-audit-agent.json
          retention-days: 30

  check-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history for gitleaks
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          config: .gitleaks.toml
          args: "--verbose --redact --report-format json --report-path gitleaks-report.json"
      - name: Upload gitleaks report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 30

  check-sensitive-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check for private keys and PEM files in git history
        run: |
          echo "Checking for .pem files in git history..."
          if git log --all --full-history --name-only --pretty=format: -- "*.pem" | grep -q "\.pem$"; then
            echo "ERROR: .pem files found in git history"
            git log --all --full-history --name-only --pretty=format: -- "*.pem" | grep "\.pem$" | sort -u
            exit 1
          fi
          echo "Checking for private_key* files in git history..."
          if git log --all --full-history --name-only --pretty=format: -- "private_key*" | grep -q "private_key"; then
            echo "ERROR: private_key* files found in git history"
            git log --all --full-history --name-only --pretty=format: -- "private_key*" | grep "private_key" | sort -u
            exit 1
          fi
          echo "Checking for *.key files in git history..."
          if git log --all --full-history --name-only --pretty=format: -- "*.key" | grep -q "\.key$"; then
            echo "ERROR: *.key files found in git history"
            git log --all --full-history --name-only --pretty=format: -- "*.key" | grep "\.key$" | sort -u
            exit 1
          fi
          echo "All sensitive file checks passed."
