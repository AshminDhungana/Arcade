name: Build All Platforms

on:
  push:
    branches: [develop, main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g., 1.0.0)'
        required: false
        type: string

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_ext: zip
            arch: x64
            launcher_target: onedir
            agent_target: nsis
            node_version: '22'
            python_version: '3.12'
          - os: macos-latest
            artifact_ext: tar.gz
            arch: arm64
            launcher_target: onedir
            agent_target: dmg+zip
            node_version: '22'
            python_version: '3.12'
          - os: ubuntu-latest
            artifact_ext: tar.gz
            arch: x64
            launcher_target: onedir
            agent_target: appimage+deb
            node_version: '22'
            python_version: '3.12'

    env:
      PYTHON_VERSION: ${{ matrix.python_version }}
      NODE_VERSION: ${{ matrix.node_version }}
      VERSION: ${{ github.event.inputs.version || github.ref_name }}

    steps:
      # ---------------------------------------------------------
      # Checkout & Setup
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            agent/package-lock.json

      - name: Install 7zip (Windows)
        if: runner.os == 'Windows'
        run: choco install 7zip -y

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64

      # ---------------------------------------------------------
      # Build Frontend (required for Launcher datas)
      # ---------------------------------------------------------
      - name: Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Verify frontend/dist exists
        shell: bash
        run: test -f frontend/dist/index.html

      # ---------------------------------------------------------
      # Build Launcher (PyInstaller)
      # ---------------------------------------------------------
      - name: Install Python dependencies (Launcher)
        working-directory: backend
        run: |
          pip install -r requirements.txt -r requirements-dev.txt pyinstaller

      - name: Build Launcher with PyInstaller
        run: |
          pyinstaller arcade.spec --clean --noconfirm

      - name: Verify Launcher bundle (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: test -f "dist/arcade/Arcade Launcher.exe"

      - name: Verify Launcher bundle (macOS)
        if: runner.os == 'macOS'
        run: test -f "dist/arcade/Arcade Launcher"

      - name: Verify Launcher bundle (Linux)
        if: runner.os == 'Linux'
        run: test -f "dist/arcade/Arcade Launcher"

      - name: Smoke test Launcher (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo '{"jwt_secret": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}' > arcade.config.json
          "./dist/arcade/Arcade Launcher.exe" --self-test

      - name: Smoke test Launcher (macOS)
        if: runner.os == 'macOS'
        run: |
          echo '{"jwt_secret": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}' > arcade.config.json
          "./dist/arcade/Arcade Launcher" --self-test

      - name: Smoke test Launcher (Linux)
        if: runner.os == 'Linux'
        run: |
          echo '{"jwt_secret": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}' > arcade.config.json
          xvfb-run -a "./dist/arcade/Arcade Launcher" --self-test

      - name: Package Launcher artifact
        id: package_launcher
        shell: bash
        run: |
          VERSION="${{ env.VERSION }}"
          ARCH="${{ matrix.arch }}"

          if [[ "$RUNNER_OS" == "Windows" ]]; then
            "/c/Program Files/7-Zip/7z.exe" a -tzip "arcade-launcher-${VERSION}-windows-${ARCH}.zip" dist/arcade/*
            echo "path=arcade-launcher-${VERSION}-windows-${ARCH}.zip" >> "$GITHUB_OUTPUT"
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            tar -czf "arcade-launcher-${VERSION}-macos-${ARCH}.tar.gz" -C dist arcade
            echo "path=arcade-launcher-${VERSION}-macos-${ARCH}.tar.gz" >> "$GITHUB_OUTPUT"
          else
            tar -czf "arcade-launcher-${VERSION}-linux-${ARCH}.tar.gz" -C dist arcade
            echo "path=arcade-launcher-${VERSION}-linux-${ARCH}.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      # ---------------------------------------------------------
      # Build Agent (electron-builder)
      # ---------------------------------------------------------
      - name: Install Agent dependencies
        working-directory: agent
        run: npm ci

      - name: Build Agent (Windows)
        if: runner.os == 'Windows'
        working-directory: agent
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          MASTER_PIN: ${{ secrets.MASTER_PIN }}
        run: npm run build:win

      - name: Build Agent (macOS)
        if: runner.os == 'macOS'
        working-directory: agent
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          MASTER_PIN: ${{ secrets.MASTER_PIN }}
        run: npm run build:mac

      - name: Build Agent (Linux)
        if: runner.os == 'Linux'
        working-directory: agent
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          MASTER_PIN: ${{ secrets.MASTER_PIN }}
        run: npm run build:linux

      - name: Verify Agent artifacts (Windows)
        if: runner.os == 'Windows'
        working-directory: agent
        shell: bash
        run: |
          ls dist/*.exe >/dev/null 2>&1 || { echo "No NSIS installer found in dist"; exit 1; }

      - name: Verify Agent artifacts (macOS)
        if: runner.os == 'macOS'
        working-directory: agent
        run: test -f dist/*.dmg && test -d dist/mac*/Arcade\ Agent.app

      - name: Verify Agent artifacts (Linux)
        if: runner.os == 'Linux'
        working-directory: agent
        run: test -f dist/*.AppImage && test -f dist/*.deb

      - name: Smoke test Agent (macOS)
        if: runner.os == 'macOS'
        working-directory: agent
        run: ./dist/mac*/Arcade\ Agent.app/Contents/MacOS/Arcade\ Agent --smoke-test

      - name: Smoke test Agent (Linux)
        if: runner.os == 'Linux'
        working-directory: agent
        run: xvfb-run -a ./dist/*.AppImage --appimage-extract-and-run --smoke-test

      - name: Package Agent artifacts
        id: package_agent
        working-directory: agent
        shell: bash
        run: |
          VERSION="${{ env.VERSION }}"
          ARCH="${{ matrix.arch }}"

          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp dist/*.exe "arcade-agent-${VERSION}-windows-${ARCH}.exe"
            echo "paths=agent/arcade-agent-${VERSION}-windows-${ARCH}.exe" >> "$GITHUB_OUTPUT"
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            cp dist/*.dmg "arcade-agent-${VERSION}-macos-${ARCH}.dmg"
            echo "paths=agent/arcade-agent-${VERSION}-macos-${ARCH}.dmg" >> "$GITHUB_OUTPUT"
          else
            cp dist/*.AppImage "arcade-agent-${VERSION}-linux-${ARCH}.AppImage"
            cp dist/*.deb "arcade-agent-${VERSION}-linux-${ARCH}.deb"
            {
              echo "paths=agent/arcade-agent-${VERSION}-linux-${ARCH}.AppImage"
              echo "agent/arcade-agent-${VERSION}-linux-${ARCH}.deb"
            } >> "$GITHUB_OUTPUT"
          fi

      # ---------------------------------------------------------
      # Upload Artifacts
      # ---------------------------------------------------------
      - name: Upload Launcher artifact
        uses: actions/upload-artifact@v4
        with:
          name: arcade-launcher-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ steps.package_launcher.outputs.path }}
          retention-days: 30

      - name: Upload Agent artifact(s)
        uses: actions/upload-artifact@v4
        with:
          name: arcade-agent-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ steps.package_agent.outputs.paths }}
          retention-days: 30

      # ---------------------------------------------------------
      # GitHub Release (on tag push only)
      # ---------------------------------------------------------
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            arcade-launcher-${{ env.VERSION }}-${{ matrix.os }}-${{ matrix.arch }}.*
            agent/arcade-agent-${{ env.VERSION }}-${{ matrix.os }}-${{ matrix.arch }}.*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------
  # Release aggregation job (runs after all matrix jobs complete)
  # ---------------------------------------------------------
  release:
    name: Aggregate Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: arcade-*
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f -name "arcade-*" | sort

      - name: Final Release (attach all)
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/arcade-*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
